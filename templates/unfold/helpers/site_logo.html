{% load i18n %}

<a href="{% url "admin:index" %}" class="keno-cms-brand" title="{% trans 'Trang chủ' %}">
    {% if site_logo.light and site_logo.dark %}
        <img src="{{ site_logo.dark }}" alt="Keno" class="keno-cms-logo hidden dark:block"/>
        <img src="{{ site_logo.light }}" alt="Keno" class="keno-cms-logo block dark:hidden" />
    {% else %}
        <img src="{{ site_logo }}" class="keno-cms-logo" alt="Keno" />
    {% endif %}
</a>
