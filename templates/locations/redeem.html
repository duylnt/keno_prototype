{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <h1>Quét mã O2O tại POS</h1>
</section>
<form class="card form" method="post">
  {% csrf_token %}
  <label>Mã trải nghiệm <input name="code" required placeholder="ABCD1234"></label>
  <label>Điểm bán
    <select name="pos_id" required>
      <option value="">— Chọn điểm bán —</option>
      {% for loc in locations %}
        <option value="{{ loc.pk }}">{{ loc.name }} — {{ loc.city }}</option>
      {% endfor %}
    </select>
  </label>
  <button class="btn btn-gold" type="submit">Xác nhận</button>
</form>
{% if message %}<p class="flash">{{ message }}</p>{% endif %}
{% endblock %}
