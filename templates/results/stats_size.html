{% extends "base.html" %}
{% block extra_head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
{% endblock %}
{% block content %}
<section class="page-head">
  <h1>Lịch sử Lớn / Nhỏ</h1>
  <p class="muted">Nhỏ = tổng 210–810 · Lớn = tổng 811–1410</p>
</section>
<article class="card">
  <div class="chart-frame chart-frame-line">
    <canvas id="sizeTrend"></canvas>
  </div>
</article>
<div class="table-wrap">
  <table class="data">
    <thead><tr><th>Kỳ</th><th>Tổng</th><th>Lớn/Nhỏ</th></tr></thead>
    <tbody>
      {% for d in draws %}
      <tr><td>{{ d.period_code }}</td><td>{{ d.total }}</td><td>{{ d.size_label }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
<script id="keno-series" type="application/json">{{ series_json|safe }}</script>
{% endblock %}
